[project]
name = "crucible"
version = "0.1.0"
description = "Crucible — vulnerability discovery harness (Phase 1): Recon -> Hunt -> Validate -> Report"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=1.0",
    "pydantic>=2.6",
    "litellm>=1.40",
    "sqlalchemy>=2.0",
    "tree-sitter>=0.21",
    "opentelemetry-sdk>=1.25",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
crucible = "crucible.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
