[project]
name = "crucible"
version = "0.1.0"
description = "Crucible — vulnerability discovery harness (Phase 1): Recon -> Hunt -> Validate -> Report"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4,<2",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1",
    "langchain-ollama>=1.1",
    "langchain-deepseek>=1.1",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]
# Extra model providers (Ollama is built in via langchain-ollama).
providers = ["litellm>=1.40"]
# Cross-repo reachability (Phase 3) and language detection.
codeintel = ["tree-sitter>=0.21"]
# Traces to a collector instead of local stdout/file.
otel = ["opentelemetry-sdk>=1.25"]

[project.scripts]
crucible = "crucible.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
