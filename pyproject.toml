[project]
name = "crucible"
version = "0.1.0"
description = "Crucible — vulnerability discovery harness (Phase 1): Recon -> Hunt -> Validate -> Report"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mohamed Benachour" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "langchain>=1.4,<2",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1",
    "langchain-ollama>=1.1",
    "langchain-deepseek>=1.1",
    "langchain-openai>=1.1",
    "pydantic>=2.6",
    "rich>=13.7",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "tree-sitter>=0.21",
    "tree-sitter-language-pack>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]
# Extra model providers (Ollama is built in via langchain-ollama).
providers = ["litellm>=1.40"]
# Cross-repo reachability (Phase 3): Joern CPG bridge etc.
codeintel = []
# Export LangChain/LangGraph traces to a local OTLP collector (specs §13).
otel = [
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
]

[project.urls]
Homepage = "https://github.com/mbenachour/crucible"
Repository = "https://github.com/mbenachour/crucible"

[project.scripts]
crucible = "crucible.cli:app"

[tool.setuptools.packages.find]
include = ["crucible*"]

[tool.setuptools.package-data]
crucible = ["skills/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
